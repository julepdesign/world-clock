<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock</title>
  </head>
  <body>
    <div class="world-clock">
      <h1>World clock</h1>
      <select name="" id="city">
        <option value="">Select a city</option>
        <option value="current" data-city="My location">
          My current location
        </option>
        <option value="Europe/London" data-city="London">London</option>
        <option value="America/Mexico_City" data-city="Mexico City">
          Mexico City
        </option>
        <option value="Pacific/Tahiti" data-city="Tahiti">Tahiti</option>
        <option value="Australia/Brisbane" data-city="Byron Bay">
          Byron Bay
        </option>
        <option value="America/New_York" data-city="Montreal">Montreal</option>
        <option value="Europe/Budapest" data-city="Budapest">Budapest</option>
        <option value="Asia/Colombo" data-city="Colombo">Colombo</option>
      </select>
      <div id="cities">
        <div class="clock-container" id="los-angeles">
          <div class="location">
            <div class="date"></div>
            <h2>Los Angeles</h2>
          </div>
          <div class="time"></div>
        </div>
        <div class="clock-container" id="malaga">
          <div class="location">
            <div class="date"></div>
            <h2>Málaga</h2>
          </div>
          <div class="time"></div>
        </div>
        <div class="clock-container" id="bangkok">
          <div class="location">
            <div class="date"></div>
            <h2>Bangkok</h2>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>
    <footer>
      Designed by
      <a href="https://julepdesign.com" target="_blank">julepdesign.com</a
      ><br />
      Coded by ✌️👽
      <a href="https://github.com/julepdesign" target="_blank"> julepdesign </a
      >, available open-sourced on
      <a href="https://github.com/julepdesign/world-clock" target="_blank">
        Github</a
      >
      & hosted on
      <a href="https://world-clock-gamma-smoky.vercel.app/" target="_blank">
        Vercel</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
